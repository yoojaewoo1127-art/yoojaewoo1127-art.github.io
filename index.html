<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리들의 랭킹보드</title>
    <!-- 초보자를 위한 Firebase 구버전 호환 라이브러리 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; padding: 20px; max-width: 600px; margin: 0 auto; }
        .box { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        button { background: #4CAF50; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
        button:hover { background: #45a049; }
        .hidden { display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border-bottom: 1px solid #ddd; padding: 10px; text-align: center; }
    </style>
</head>
<body>

    <h1 style="text-align: center;">🏆 랭킹보드</h1>

    <!-- 1. 로그인 화면 -->
    <div id="login-box" class="box">
        <h3>로그인이 필요합니다</h3>
        <button onclick="loginWithGoogle()">구글 계정으로 로그인 / 가입</button>
    </div>

    <!-- 2. 승인 대기 화면 -->
    <div id="pending-box" class="box hidden">
        <h3>가입 신청 완료!</h3>
        <p>관리자의 승인을 기다려주세요.</p>
        <button onclick="logout()">로그아웃</button>
    </div>

    <!-- 3. 일반 유저 메인 화면 -->
    <div id="main-box" class="box hidden">
        <div style="display: flex; justify-content: space-between;">
            <h3 id="user-greeting">환영합니다!</h3>
            <button onclick="logout()" style="background:#ff4c4c;">로그아웃</button>
        </div>
        <h2>내 포인트: <span id="my-points" style="color: #4CAF50;">0</span> P</h2>
        
        <hr>
        <h3>📊 전체 랭킹</h3>
        <table>
            <thead><tr><th>순위</th><th>이름</th><th>포인트</th></tr></thead>
            <tbody id="ranking-list"></tbody>
        </table>
    </div>

    <!-- 4. 관리자 전용 화면 -->
    <div id="admin-box" class="box hidden" style="border: 2px solid #ff9800;">
        <h3 style="color: #ff9800;">👑 관리자 패널</h3>
        
        <h4>가입 대기 유저</h4>
        <ul id="pending-users-list"></ul>

        <h4>포인트 관리</h4>
        <table>
            <thead><tr><th>이름</th><th>현재 포인트</th><th>점수 추가/차감</th></tr></thead>
            <tbody id="admin-points-list"></tbody>
        </table>
    </div>

    <script>
        // 알려주신 Firebase 설정값 적용 완료
        const firebaseConfig = {
            apiKey: "AIzaSyAjtKYu90c4n4BZyaS0DYM9zAMxo93E114",
            authDomain: "poker-c03bc.firebaseapp.com",
            projectId: "poker-c03bc",
            storageBucket: "poker-c03bc.firebasestorage.app",
            messagingSenderId: "967631702006",
            appId: "1:967631702006:web:62489a90f89e26f585a9d7",
            measurementId: "G-4L79X7J0KY"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // 알려주신 관리자 이메일 적용 완료
        const adminEmail = "yoojaewoo1127@gmail.com"; 

        let currentUser = null;

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                checkUserStatus(user);
            } else {
                showScreen('login-box');
            }
        });

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider);
        }

        function logout() {
            auth.signOut();
            location.reload();
        }

        async function checkUserStatus(user) {
            const userDoc = await db.collection("users").doc(user.uid).get();
            
            if (!userDoc.exists) {
                const realName = prompt("게임에서 사용할 이름을 입력해주세요:");
                await db.collection("users").doc(user.uid).set({
                    name: realName || user.displayName,
                    email: user.email,
                    points: 0,
                    status: "pending"
                });
                showScreen('pending-box');
            } else {
                const userData = userDoc.data();
                if (userData.email === adminEmail) {
                    showScreen('main-box');
                    document.getElementById('admin-box').style.display = 'block';
                    loadMainData(userData);
                    loadAdminPanel();
                } else if (userData.status === "pending") {
                    showScreen('pending-box');
                } else if (userData.status === "approved") {
                    showScreen('main-box');
                    loadMainData(userData);
                }
            }
        }

        function showScreen(screenId) {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('pending-box').style.display = 'none';
            document.getElementById('main-box').style.display = 'none';
            document.getElementById('admin-box').style.display = 'none';
            document.getElementById(screenId).style.display = 'block';
        }

        function loadMainData(userData) {
            document.getElementById('user-greeting').innerText = userData.name + "님 환영합니다!";
            
            db.collection("users").doc(currentUser.uid).onSnapshot((doc) => {
                if (doc.exists) document.getElementById('my-points').innerText = doc.data().points;
            });

            db.collection("users").where("status", "==", "approved").orderBy("points", "desc").onSnapshot((snapshot) => {
                const tbody = document.getElementById('ranking-list');
                tbody.innerHTML = "";
                let rank = 1;
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    tbody.innerHTML += `<tr><td>${rank++}</td><td>${data.name}</td><td>${data.points} P</td></tr>`;
                });
            });
        }

        function loadAdminPanel() {
            db.collection("users").where("status", "==", "pending").onSnapshot((snapshot) => {
                const ul = document.getElementById('pending-users-list');
                ul.innerHTML = "";
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    ul.innerHTML += `<li>${data.name} (${data.email}) <button onclick="approveUser('${doc.id}')">가입 승인</button></li>`;
                });
            });

            db.collection("users").where("status", "==", "approved").onSnapshot((snapshot) => {
                const tbody = document.getElementById('admin-points-list');
                tbody.innerHTML = "";
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    tbody.innerHTML += `
                        <tr>
                            <td>${data.name}</td>
                            <td>${data.points}</td>
                            <td>
                                <input type="number" id="input-${doc.id}" style="width:60px;" placeholder="점수">
                                <button onclick="updatePoints('${doc.id}', ${data.points})">적용</button>
                            </td>
                        </tr>
                    `;
                });
            });
        }

        function approveUser(uid) {
            db.collection("users").doc(uid).update({ status: "approved" });
        }

        function updatePoints(uid, currentPoints) {
            const inputVal = document.getElementById(`input-${uid}`).value;
            if (!inputVal) return;
            const finalPoints = currentPoints + parseInt(inputVal); 
            db.collection("users").doc(uid).update({ points: finalPoints });
            document.getElementById(`input-${uid}`).value = ""; 
        }
    </script>
</body>
</html>
