<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업그레이드 랭킹보드</title>
    <!-- Firebase 라이브러리 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <!-- 그래프(Chart.js) 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #2c3e50; color: #ecf0f1; padding: 10px; max-width: 700px; margin: 0 auto; }
        .box { background: #34495e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); margin-bottom: 20px; }
        button { background: #e67e22; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #d35400; }
        input, select { padding: 8px; border-radius: 5px; border: 1px solid #7f8c8d; background: #ecf0f1; color: #2c3e50; }
        .hidden { display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #ecf0f1; color: #2c3e50; border-radius: 5px; overflow: hidden; }
        th, td { border-bottom: 1px solid #bdc3c7; padding: 10px; text-align: center; }
        th { background: #95a5a6; }
        
        /* 탭 메뉴 디자인 */
        .tab-menu { display: flex; gap: 5px; margin-bottom: 15px; overflow-x: auto; }
        .tab-btn { flex: 1; background: #7f8c8d; padding: 10px; text-align: center; border-radius: 5px; cursor: pointer; font-weight: bold; white-space: nowrap; }
        .tab-btn.active { background: #e67e22; color: white; }
        
        ul { list-style: none; padding: 0; }
        li { background: #2c3e50; margin-bottom: 5px; padding: 10px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center;}
    </style>
</head>
<body>

    <h1 style="text-align: center; color: #f1c40f;">💎 게임 대시보드</h1>

    <!-- 1. 로그인 화면 -->
    <div id="login-box" class="box">
        <h3 style="text-align: center;">로그인이 필요합니다</h3>
        <div style="text-align: center;">
            <button onclick="loginWithGoogle()">구글 계정으로 시작하기</button>
        </div>
    </div>

    <!-- 2. 승인 대기 화면 -->
    <div id="pending-box" class="box hidden">
        <h3>가입 신청 완료!</h3>
        <p>관리자의 승인을 기다려주세요.</p>
        <button onclick="logout()">로그아웃</button>
    </div>

    <!-- 3. 메인 앱 화면 (탭 구조) -->
    <div id="app-box" class="box hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 id="user-greeting" style="margin: 0;">환영합니다!</h3>
            <button onclick="logout()" style="background:#c0392b; padding: 5px 10px;">로그아웃</button>
        </div>

        <!-- 탭 메뉴 버튼 -->
        <div class="tab-menu">
            <div class="tab-btn active" onclick="showTab('tab-profile')">내 프로필</div>
            <div class="tab-btn" onclick="showTab('tab-ranking')">랭킹보드</div>
            <div class="tab-btn" onclick="showTab('tab-trade')">거래소</div>
            <div id="admin-tab-btn" class="tab-btn hidden" onclick="showTab('tab-admin')" style="background: #8e44ad;">관리자</div>
        </div>

        <!-- [탭 1] 내 프로필 -->
        <div id="tab-profile" class="tab-content">
            <h2 style="text-align: center;">보유 재화: <span id="my-points" style="color: #f1c40f;">0</span> P <span id="my-yield" style="font-size: 0.6em; color: #bdc3c7;">(0.0%)</span></h2>
            
            <div style="background: white; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
                <canvas id="myChart" height="150"></canvas>
            </div>

            <!-- 빌린 돈(장부) 표시 영역 -->
            <div style="background: #c0392b; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
                <h4 style="margin: 0 0 10px 0; color: white;">🚨 내가 갚아야 할 포인트</h4>
                <ul id="my-debts-list" style="margin: 0; padding: 0; max-height: 150px; overflow-y: auto;"></ul>
            </div>

            <h4>📝 내 포인트 변동 기록</h4>
            <ul id="my-history-list" style="max-height: 200px; overflow-y: auto;"></ul>
        </div>

        <!-- [탭 2] 랭킹보드 -->
        <div id="tab-ranking" class="tab-content hidden">
            <h4>📊 전체 유저 랭킹</h4>
            <table>
                <thead><tr><th>순위</th><th>이름</th><th>포인트</th></tr></thead>
                <tbody id="ranking-list"></tbody>
            </table>
        </div>

        <!-- [탭 3] 포인트 거래소 (송금/빌려주기) -->
        <div id="tab-trade" class="tab-content hidden">
            <h4>💸 다른 유저와 거래하기</h4>
            <p style="font-size: 0.9em; color: #bdc3c7;">친구에게 포인트를 선물하거나 빌려줄 수 있습니다.</p>
            
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <select id="trade-target">
                    <option value="">받을 사람 선택...</option>
                </select>
                <input type="number" id="trade-amount" placeholder="보낼 포인트 수량" min="1">
                <label style="color: #ecf0f1; font-size: 0.9em; display: flex; align-items: center; gap: 5px;">
                    <input type="checkbox" id="is-loan" style="width: auto;"> 그냥 선물이 아니라 '빌려주기' 입니다 (장부 기록)
                </label>
                <button onclick="transferPoints()">송금 / 빌려주기</button>
            </div>
        </div>

        <!-- [탭 4] 관리자 전용 화면 -->
        <div id="tab-admin" class="tab-content hidden">
            <h4 style="color: #f1c40f;">가입 승인 대기</h4>
            <ul id="pending-users-list"></ul>
            <hr>
            <h4 style="color: #f1c40f;">게임 포인트 일괄 업데이트</h4>
            <table>
                <thead><tr><th>이름</th><th>현재 포인트</th><th>변동 (+/-)</th></tr></thead>
                <tbody id="admin-points-list"></tbody>
            </table>
        </div>

    </div>

    <script>
        // 🔴🔴🔴 여기에 본인의 Firebase 설정값을 다시 붙여넣으세요! 🔴🔴🔴
        const firebaseConfig = {
            apiKey: "AIzaSyAjtKYu90c4n4BZyaS0DYM9zAMxo93E114",
            authDomain: "poker-c03bc.firebaseapp.com",
            projectId: "poker-c03bc",
            storageBucket: "poker-c03bc.firebasestorage.app",
            messagingSenderId: "967631702006",
            appId: "1:967631702006:web:62489a90f89e26f585a9d7",
            measurementId: "G-4L79X7J0KY"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // 🔴🔴🔴 본인(관리자)의 구글 이메일 주소를 확인하세요! 🔴🔴🔴
        const adminEmail = "yoojaewoo1127@gmail.com"; 

        let currentUser = null;
        let myChart = null; // 그래프 변수

        // 1. 로그인 상태 감지
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                checkUserStatus(user);
            } else {
                document.getElementById('login-box').style.display = 'block';
                document.getElementById('pending-box').style.display = 'none';
                document.getElementById('app-box').style.display = 'none';
            }
        });

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider);
        }

        function logout() {
            auth.signOut();
            location.reload();
        }

        // 2. 유저 상태 확인 (가입 시 200P 기본 지급)
        async function checkUserStatus(user) {
            const userDoc = await db.collection("users").doc(user.uid).get();
            
            if (!userDoc.exists) {
                const realName = prompt("게임에서 사용할 멋진 닉네임을 입력해주세요:");
                if (!realName) { auth.signOut(); return; }
                
                await db.collection("users").doc(user.uid).set({
                    name: realName,
                    email: user.email,
                    points: 200, // 시작 포인트 200
                    status: "pending"
                });
                
                await db.collection("history").add({
                    uid: user.uid, change: 200, pointsAfter: 200, reason: "초기 가입 지원금", timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                location.reload();
            } else {
                const userData = userDoc.data();
                if (userData.email === adminEmail) {
                    document.getElementById('admin-tab-btn').style.display = 'block';
                    loadApp(userData, true);
                } else if (userData.status === "pending") {
                    document.getElementById('login-box').style.display = 'none';
                    document.getElementById('pending-box').style.display = 'block';
                } else if (userData.status === "approved") {
                    loadApp(userData, false);
                }
            }
        }

        // 3. 앱 화면 로드 (탭 전환 기능 포함)
        function loadApp(userData, isAdmin) {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('pending-box').style.display = 'none';
            document.getElementById('app-box').style.display = 'block';
            document.getElementById('user-greeting').innerText = userData.name + "님 환영합니다!";
            
            loadProfileData();
            loadRankingAndTrade();
            if(isAdmin) loadAdminPanel();
        }

        function showTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(content => content.style.display = 'none');
            document.getElementById(tabId).style.display = 'block';
        }

        // 4. 내 프로필 데이터 (수익률, 그래프, 빚 목록)
        function loadProfileData() {
            // 포인트 및 수익률 실시간 업데이트
            db.collection("users").doc(currentUser.uid).onSnapshot((doc) => {
                if(doc.exists) {
                    const myPts = doc.data().points;
                    document.getElementById('my-points').innerText = myPts.toLocaleString();
                    
                    const yieldRate = (((myPts - 200) / 200) * 100).toFixed(1);
                    const yieldColor = yieldRate > 0 ? '#2ecc71' : (yieldRate < 0 ? '#e74c3c' : '#bdc3c7');
                    const yieldSign = yieldRate > 0 ? '+' : '';
                    document.getElementById('my-yield').innerHTML = `<span style="color:${yieldColor};">(${yieldSign}${yieldRate}%)</span>`;
                }
            });

            // 내 기록 실시간 로드 및 자바스크립트 정렬로 그래프 그리기 (에러 방지)
            db.collection("history").where("uid", "==", currentUser.uid)
            .onSnapshot((snapshot) => {
                const historyList = document.getElementById('my-history-list');
                historyList.innerHTML = "";
                
                let logs = [];
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.timestamp) logs.push(data);
                });

                logs.sort((a, b) => a.timestamp.toDate() - b.timestamp.toDate());

                const labels = [];
                const dataPoints = [];
                let listHtml = "";

                logs.forEach((data) => {
                    const dateObj = data.timestamp.toDate();
                    const timeStr = `${dateObj.getMonth()+1}/${dateObj.getDate()} ${String(dateObj.getHours()).padStart(2,'0')}:${String(dateObj.getMinutes()).padStart(2,'0')}`;
                    const changeStr = data.change > 0 ? `+${data.change}` : data.change;
                    const color = data.change > 0 ? '#2ecc71' : (data.change < 0 ? '#e74c3c' : '#ecf0f1');

                    listHtml = `<li>
                        <span style="font-size:0.8em; color:#bdc3c7;">${timeStr}</span> 
                        <span>${data.reason}</span> 
                        <strong style="color:${color};">${changeStr}</strong>
                    </li>` + listHtml;

                    labels.push(timeStr);
                    dataPoints.push(data.pointsAfter);
                });
                
                historyList.innerHTML = listHtml;
                renderChart(labels, dataPoints);
            });

            // 내 부채(빌린 내역) 실시간 로드 (인덱스 에러 방지용 자바스크립트 필터링)
            db.collection("loans").where("borrowerId", "==", currentUser.uid)
            .onSnapshot((snapshot) => {
                const debtsList = document.getElementById('my-debts-list');
                debtsList.innerHTML = "";
                let hasDebts = false;

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.status === "active") {
                        hasDebts = true;
                        debtsList.innerHTML += `<li style="background: rgba(255,255,255,0.1); margin-bottom: 5px;">
                            <span style="color: white;">${data.lenderName}님에게 <strong>${data.amount}P</strong></span>
                            <button onclick="repayLoan('${doc.id}', '${data.lenderId}', '${data.lenderName}', ${data.amount})" style="background: #f39c12; padding: 5px; color: #fff;">갚기</button>
                        </li>`;
                    }
                });

                if (!hasDebts) debtsList.innerHTML = "<li style='background: transparent; justify-content: center; color: #ecf0f1;'>갚을 포인트가 없습니다! 🎉</li>";
            });
        }

        // 5. 랭킹보드 및 거래소 (인덱스 에러 방지 버전)
        function loadRankingAndTrade() {
            db.collection("users").orderBy("points", "desc")
            .onSnapshot((snapshot) => {
                const rankingList = document.getElementById('ranking-list');
                const tradeSelect = document.getElementById('trade-target');
                
                rankingList.innerHTML = "";
                tradeSelect.innerHTML = '<option value="">받을 사람 선택...</option>';
                
                let rank = 1;
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    if (data.status === "approved") {
                        let rankIcon = rank === 1 ? "🥇" : (rank === 2 ? "🥈" : (rank === 3 ? "🥉" : rank));
                        rankingList.innerHTML += `<tr><td style="color:#2c3e50;">${rankIcon}</td><td style="color:#2c3e50; font-weight:bold;">${data.name}</td><td style="color:#e67e22; font-weight:bold;">${data.points.toLocaleString()}</td></tr>`;
                        rank++;

                        if (doc.id !== currentUser.uid) {
                            tradeSelect.innerHTML += `<option value="${doc.id}">${data.name}</option>`;
                        }
                    }
                });
            });
        }

        // 6. 거래 기능 (송금 및 빌려주기)
        async function transferPoints() {
            const targetUid = document.getElementById('trade-target').value;
            const amount = parseInt(document.getElementById('trade-amount').value);
            const isLoan = document.getElementById('is-loan').checked;
            
            if (!targetUid) return alert("받을 사람을 선택해주세요.");
            if (isNaN(amount) || amount <= 0) return alert("올바른 금액을 입력해주세요.");

            const myDoc = await db.collection("users").doc(currentUser.uid).get();
            const myName = myDoc.data().name;
            const myPoints = myDoc.data().points;

            if (myPoints < amount) return alert("보유한 포인트가 부족합니다!");

            const targetDoc = await db.collection("users").doc(targetUid).get();
            const targetName = targetDoc.data().name;
            const targetPoints = targetDoc.data().points;

            const actionText = isLoan ? "빌려주시겠습니까? (상대방 프로필에 빚이 기록됩니다)" : "그냥 선물하시겠습니까?";

            if (confirm(`${targetName}님에게 ${amount} 포인트를 ${actionText}`)) {
                await db.collection("users").doc(currentUser.uid).update({ points: myPoints - amount });
                await db.collection("users").doc(targetUid).update({ points: targetPoints + amount });

                if (isLoan) {
                    await db.collection("loans").add({
                        lenderId: currentUser.uid, lenderName: myName,
                        borrowerId: targetUid, borrowerName: targetName,
                        amount: amount, status: "active",
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    await db.collection("history").add({ uid: currentUser.uid, change: -amount, pointsAfter: myPoints - amount, reason: `${targetName}에게 빌려줌`, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                    await db.collection("history").add({ uid: targetUid, change: amount, pointsAfter: targetPoints + amount, reason: `${myName}님에게 빌림`, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                } else {
                    await db.collection("history").add({ uid: currentUser.uid, change: -amount, pointsAfter: myPoints - amount, reason: `${targetName}에게 선물함`, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                    await db.collection("history").add({ uid: targetUid, change: amount, pointsAfter: targetPoints + amount, reason: `${myName}님으로부터 선물받음`, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                }

                alert("거래가 완료되었습니다!");
                document.getElementById('trade-amount').value = "";
                document.getElementById('is-loan').checked = false;
            }
        }

        // 7. 빌린 돈 갚기
        async function repayLoan(loanId, lenderId, lenderName, amount) {
            const myDoc = await db.collection("users").doc(currentUser.uid).get();
            const myPoints = myDoc.data().points;
            const myName = myDoc.data().name;

            if (myPoints < amount) return alert("현재 보유한 포인트가 부족하여 갚을 수 없습니다.");

            if (confirm(`${lenderName}님에게 빌린 ${amount} 포인트를 갚으시겠습니까?`)) {
                const targetDoc = await db.collection("users").doc(lenderId).get();
                const targetPoints = targetDoc.data().points;

                await db.collection("users").doc(currentUser.uid).update({ points: myPoints - amount });
                await db.collection("users").doc(lenderId).update({ points: targetPoints + amount });
                await db.collection("loans").doc(loanId).update({ status: "repaid", repaidAt: firebase.firestore.FieldValue.serverTimestamp() });

                await db.collection("history").add({ uid: currentUser.uid, change: -amount, pointsAfter: myPoints - amount, reason: `${lenderName}님에게 빌린 돈 갚음`, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                await db.collection("history").add({ uid: lenderId, change: amount, pointsAfter: targetPoints + amount, reason: `${myName}님이 빌려간 돈을 갚음`, timestamp: firebase.firestore.FieldValue.serverTimestamp() });

                alert("성공적으로 포인트를 갚았습니다!");
            }
        }

        // 8. 관리자 기능 로드
        function loadAdminPanel() {
            db.collection("users").where("status", "==", "pending").onSnapshot((snapshot) => {
                const ul = document.getElementById('pending-users-list');
                ul.innerHTML = "";
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    ul.innerHTML += `<li>${data.name} <button onclick="approveUser('${doc.id}')" style="padding: 5px; font-size: 0.8em;">가입 승인</button></li>`;
                });
            });

            db.collection("users").where("status", "==", "approved").onSnapshot((snapshot) => {
                const tbody = document.getElementById('admin-points-list');
                tbody.innerHTML = "";
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    tbody.innerHTML += `
                        <tr>
                            <td style="color:#2c3e50;">${data.name}</td>
                            <td style="color:#2c3e50;">${data.points}</td>
                            <td>
                                <input type="number" id="admin-input-${doc.id}" style="width:50px; padding:5px;" placeholder="+ / -">
                                <button onclick="adminUpdatePoints('${doc.id}', ${data.points}, '${data.name}')" style="padding: 5px; background:#27ae60;">적용</button>
                            </td>
                        </tr>
                    `;
                });
            });
        }

        function approveUser(uid) {
            db.collection("users").doc(uid).update({ status: "approved" });
        }

        async function adminUpdatePoints(uid, currentPoints, userName) {
            const inputVal = document.getElementById(`admin-input-${uid}`).value;
            if (!inputVal) return;
            
            const changeAmount = parseInt(inputVal);
            const finalPoints = currentPoints + changeAmount;
            
            await db.collection("users").doc(uid).update({ points: finalPoints });
            await db.collection("history").add({
                uid: uid, change: changeAmount, pointsAfter: finalPoints, reason: "관리자 게임 결과 반영", timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            document.getElementById(`admin-input-${uid}`).value = ""; 
        }

        // 9. 그래프 그리기 (Chart.js)
        function renderChart(labels, dataPoints) {
            const ctx = document.getElementById('myChart').getContext('2d');
            if (myChart) myChart.destroy(); 
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '나의 포인트 변화',
                        data: dataPoints,
                        borderColor: '#e67e22',
                        backgroundColor: 'rgba(230, 126, 34, 0.2)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3,
                        pointBackgroundColor: '#2c3e50'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true } }
                }
            });
        }
    </script>
</body>
</html>
